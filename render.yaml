services:
  # Spring Boot Backend Service (Free Render Container)
  - type: web
    name: vitalsync-backend
    runtime: docker
    rootDir: backend-app
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8081
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  # React Frontend Service (Free Render Static Site)
  - type: static
    name: vitalsync-frontend
    rootDir: frontend-app/Acumed-main_W/Acumed-main/Acumed-main/frontend
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
